<div class="students-page">
    <div class="students-intro">
        <div class="students-title">
            <h1 tabindex="0">Students</h1>
        </div>

        <div class="students-main-button">
            <button type="button" class="delete-selected-btn">Delete selected</button>

            <button type="button" class="add-students-btn">
                <i class="fa-solid fa-plus"></i>
            </button>

        </div>
    </div>

    <div class="table-container" tabindex="0" aria-label="Students table info">
        <table class="students-table">
            <tbody class="students-table-body">
            <tr>
                <th><input type="checkbox" class="main-checkbox"/></th>
                <th>Group</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Birthday</th>
                <th>Status</th>
                <th>Options</th>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-container">
        <button class="pagination-btn prev" disabled>&laquo; Prev</button>
        <div class="pagination-pages">
            <button class="pagination-btn active">1</button>
            <button class="pagination-btn">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn">5</button>
        </div>
        <button class="pagination-btn next">Next &raquo;</button>
    </div>

    <div class="add-student-modal-container" tabindex="0">
        <div class="modal">
            <div class="modal-header">
                <h3 class="add-edit-modal-header" tabindex="0">Add Students</h3>
                <button class="modal-exit-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form class="create-student-form">
                <label for="group">Group:</label>
                <select id="group" name="group">
                    <option value="PZ-21">PZ-21</option>
                    <option value="PZ-22">PZ-22</option>
                    <option value="PZ-23">PZ-23</option>
                    <option value="PZ-24">PZ-24</option>
                    <option value="PZ-25">PZ-25</option>
                    <option value="PZ-26">PZ-26</option>
                </select>

                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required/>

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required/>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="birthday">Birthday:</label>
                <input type="date" id="birthday" name="birthday" required/>

                <div class="form-buttons">
                    <button type="button" class="modal-close-btn">Ok</button>
                    <button type="submit" class="submit-modal-form-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div class="should-delete-student-modal">
        <div class="modal">
            <button class="modal-exit-delete-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="should-delete-text" tabindex="0"></div>
            <button class="should-delete-yes">Yes</button>
            <button class="should-delete-no">No</button>
        </div>
    </div>
</div>
